name: Deploy Live Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve active deploy directory
        id: resolve_dir
        shell: bash
        run: |
          set -euo pipefail
          LIVE_URL="${{ secrets.LIVE_URL }}"
          DEPLOY_DIR=""

          if [ -n "${LIVE_URL}" ]; then
            RUNTIME_JSON="$(curl -fsSL "${LIVE_URL}/api/runtime-health" || true)"
            FILE_PATH="$(printf '%s' "${RUNTIME_JSON}" | sed -n 's/.*"file_path":"\([^"]*\)".*/\1/p')"
            if [ -n "${FILE_PATH}" ]; then
              DEPLOY_DIR="${FILE_PATH%/server.js}"
            fi
          fi

          if [ -z "${DEPLOY_DIR}" ]; then
            DEPLOY_DIR="${{ secrets.APP_DIR }}"
          fi

          if [ -z "${DEPLOY_DIR}" ]; then
            DEPLOY_DIR="/var/www/mehedi123/data/www/softwarezoneinworld.store"
          fi

          echo "Resolved deploy dir: ${DEPLOY_DIR}"
          echo "deploy_dir=${DEPLOY_DIR}" >> "${GITHUB_OUTPUT}"

      - name: Upload project files to server (attempt 1)
        id: upload_attempt_1
        continue-on-error: true
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60s
          command_timeout: 15m
          source: "server.js,package.json,package-lock.json,public,scripts,LIVE_DEPLOY_CHECKLIST.md"
          target: ${{ steps.resolve_dir.outputs.deploy_dir }}

      - name: Wait before upload retry 2
        if: ${{ steps.upload_attempt_1.outcome == 'failure' }}
        shell: bash
        run: sleep 20

      - name: Upload project files to server (attempt 2)
        id: upload_attempt_2
        if: ${{ steps.upload_attempt_1.outcome == 'failure' }}
        continue-on-error: true
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60s
          command_timeout: 15m
          source: "server.js,package.json,package-lock.json,public,scripts,LIVE_DEPLOY_CHECKLIST.md"
          target: ${{ steps.resolve_dir.outputs.deploy_dir }}

      - name: Wait before upload retry 3
        if: ${{ steps.upload_attempt_1.outcome == 'failure' && steps.upload_attempt_2.outcome == 'failure' }}
        shell: bash
        run: sleep 40

      - name: Upload project files to server (attempt 3)
        id: upload_attempt_3
        if: ${{ steps.upload_attempt_1.outcome == 'failure' && steps.upload_attempt_2.outcome == 'failure' }}
        continue-on-error: true
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60s
          command_timeout: 15m
          source: "server.js,package.json,package-lock.json,public,scripts,LIVE_DEPLOY_CHECKLIST.md"
          target: ${{ steps.resolve_dir.outputs.deploy_dir }}

      - name: Fail if upload retries did not succeed
        if: ${{ steps.upload_attempt_1.outcome == 'failure' && steps.upload_attempt_2.outcome == 'failure' && steps.upload_attempt_3.outcome == 'failure' }}
        shell: bash
        run: |
          echo "SCP upload failed after 3 attempts. Check SSH server availability, firewall/allowlist, SSH_PORT, SSH_USER, and SSH_PRIVATE_KEY/SSH_PASSWORD secrets."
          exit 1

      - name: Install deps and restart app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            DEPLOY_DIR="${{ steps.resolve_dir.outputs.deploy_dir }}"
            cd "${DEPLOY_DIR}"
            npm install --omit=dev || echo "Warning: npm install failed, continuing with existing node_modules"

            OLD_PID="$(lsof -tiTCP:3000 -sTCP:LISTEN || true)"
            if [ -n "${OLD_PID}" ]; then
              kill -TERM "${OLD_PID}" || true
              sleep 2
            fi
            nohup node server.js > .server.log 2>&1 &
            sleep 2
            if ! pgrep -af "node server.js" >/dev/null; then
              echo "Failed to start node server.js. Last logs:"
              tail -n 80 .server.log || true
              exit 1
            fi
            pgrep -af "node server.js" || true

      - name: Verify live API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            LIVE_URL="${{ secrets.LIVE_URL }}"
            if [ -z "${LIVE_URL}" ]; then
              echo "LIVE_URL secret is empty; skipping verify step."
              exit 0
            fi
            cd "${{ steps.resolve_dir.outputs.deploy_dir }}"
            chmod +x ./scripts/verify-live-api.sh
            ./scripts/verify-live-api.sh "${LIVE_URL}"

      - name: Verify homepage no longer has removed blocks
        shell: bash
        run: |
          set -euo pipefail
          LIVE_URL="${{ secrets.LIVE_URL }}"
          if [ -z "${LIVE_URL}" ]; then
            echo "LIVE_URL secret is empty; skipping homepage content check."
            exit 0
          fi
          HTML="$(curl -fsSL "${LIVE_URL}/?v=${GITHUB_SHA}")"
          if echo "${HTML}" | grep -q "Explore Services"; then
            echo "FAIL: Old hero CTA still present on live homepage."
            exit 1
          fi
          if echo "${HTML}" | grep -q "heroWhatsAppContainer"; then
            echo "FAIL: Old hero WhatsApp widget still present on live homepage."
            exit 1
          fi
          echo "PASS: removed homepage blocks are not present."
