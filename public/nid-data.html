<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NID Information - CyberHack Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;700&family=Courier+New:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 65, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        @keyframes fadeInScreen {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes dialog3DEntry {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(50px) rotateX(45deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0) rotateX(0deg);
            }
        }

        @keyframes icon3DSpin {
            0%, 100% {
                transform: rotateY(0deg) scale(1);
            }
            50% {
                transform: rotateY(180deg) scale(1.1);
            }
        }

        @keyframes shimmer {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        @keyframes title3DGlow {
            0%, 100% {
                text-shadow: 
                    0 0 20px rgba(0, 255, 65, 1),
                    0 0 40px rgba(0, 255, 65, 0.7);
            }
            50% {
                text-shadow: 
                    0 0 30px rgba(0, 255, 65, 1),
                    0 0 60px rgba(0, 255, 65, 0.9),
                    0 0 80px rgba(0, 255, 65, 0.5);
            }
        }

        /* NID Data Display Page Styles */
        .nid-data-page {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1;
            animation: fadeInScreen 0.5s ease;
        }

        .nid-data-container {
            width: 90%;
            max-width: 700px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95) 0%, rgba(0, 20, 10, 0.95) 100%);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            border: 3px solid rgba(0, 255, 65, 0.5);
            box-shadow: 
                0 0 0 4px rgba(0, 255, 65, 0.3),
                0 0 50px rgba(0, 255, 65, 0.4),
                0 0 100px rgba(0, 255, 65, 0.2),
                inset 0 0 50px rgba(0, 255, 65, 0.1);
            position: relative;
            overflow: hidden;
            animation: dialog3DEntry 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nid-data-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(0, 255, 65, 0.1) 30%, 
                rgba(0, 212, 255, 0.1) 50%, 
                rgba(0, 255, 65, 0.1) 70%, 
                transparent 100%);
            animation: shimmer 3s infinite;
        }

        .nid-data-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .nid-data-icon {
            font-size: 60px;
            color: #00ff41;
            margin-bottom: 20px;
            animation: icon3DSpin 3s ease-in-out infinite;
            text-shadow: 
                0 0 20px rgba(0, 255, 65, 1),
                0 0 40px rgba(0, 255, 65, 0.8);
            filter: drop-shadow(0 0 10px rgba(0, 255, 65, 0.8));
        }

        .nid-data-header h1 {
            color: #00ff41;
            font-size: 32px;
            font-weight: 700;
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 
                0 0 20px rgba(0, 255, 65, 1),
                0 0 40px rgba(0, 255, 65, 0.7);
            letter-spacing: 2px;
            animation: title3DGlow 2s ease-in-out infinite;
        }

        .nid-data-content {
            position: relative;
            z-index: 1;
        }

        .nid-data-user-info {
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            border: 2px solid rgba(0, 255, 65, 0.3);
            box-shadow: 
                0 0 20px rgba(0, 255, 65, 0.2),
                inset 0 0 20px rgba(0, 255, 65, 0.05);
        }

        .nid-data-label {
            color: #00ff41;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.8);
        }

        .nid-data-value {
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .nid-data-image-section {
            padding: 25px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            border: 2px solid rgba(0, 255, 65, 0.3);
            box-shadow: 
                0 0 20px rgba(0, 255, 65, 0.2),
                inset 0 0 20px rgba(0, 255, 65, 0.05);
        }

        .nid-data-image-container {
            text-align: center;
            margin-top: 20px;
        }

        .nid-data-image {
            max-width: 100%;
            max-height: 500px;
            border-radius: 15px;
            border: 3px solid rgba(0, 255, 65, 0.5);
            box-shadow: 
                0 0 30px rgba(0, 255, 65, 0.4),
                0 0 60px rgba(0, 255, 65, 0.2),
                inset 0 0 30px rgba(0, 255, 65, 0.1);
            object-fit: contain;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
        }

        @media (max-width: 768px) {
            .nid-data-container {
                padding: 25px;
            }

            .nid-data-header h1 {
                font-size: 24px;
            }

            .nid-data-value {
                font-size: 20px;
            }

            .nid-data-image {
                max-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="nid-data-page">
        <div class="nid-data-container">
            <div class="nid-data-header">
                <div class="nid-data-icon">
                    <i class="fas fa-id-card"></i>
                </div>
                <h1>NID Information</h1>
            </div>
            <div class="nid-data-content">
                <div class="nid-data-user-info">
                    <div class="nid-data-label">Name:</div>
                    <div class="nid-data-value" id="nidDataUserName">Loading...</div>
                </div>
                <div class="nid-data-image-section">
                    <div class="nid-data-label">NID Image:</div>
                    <div class="nid-data-image-container">
                        <img id="nidDataImage" src="" alt="NID Image" class="nid-data-image" style="display: none;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get data from sessionStorage
        window.addEventListener('DOMContentLoaded', function() {
            const userName = document.getElementById('nidDataUserName');
            const dataImage = document.getElementById('nidDataImage');

            // Get data from sessionStorage
            const firstName = sessionStorage.getItem('nidFirstName');
            const lastName = sessionStorage.getItem('nidLastName');
            const imageData = sessionStorage.getItem('nidImageData');

            if (firstName && lastName) {
                userName.textContent = firstName + ' ' + lastName;
            } else {
                userName.textContent = 'No name provided';
            }

            if (imageData) {
                dataImage.src = imageData;
                dataImage.style.display = 'block';
            } else {
                dataImage.style.display = 'none';
                console.error('No image data found');
            }

            // Clear sessionStorage after loading
            sessionStorage.removeItem('nidFirstName');
            sessionStorage.removeItem('nidLastName');
            sessionStorage.removeItem('nidImageData');
        });
    </script>
</body>
</html>
