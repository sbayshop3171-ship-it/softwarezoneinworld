<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Security Processing - CyberHack Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #020916;
            --bg-secondary: #031528;
            --panel-bg: rgba(3, 14, 26, 0.9);
            --panel-strong: rgba(1, 10, 18, 0.96);
            --border: rgba(0, 255, 136, 0.45);
            --border-soft: rgba(0, 255, 136, 0.24);
            --green: #00ff88;
            --cyan: #4fd8ff;
            --text: #d8ffe9;
            --text-dim: #8ed6b4;
            --warn: #ffd166;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(0, 255, 136, 0.16), transparent 40%),
                radial-gradient(circle at 84% 78%, rgba(79, 216, 255, 0.12), transparent 40%),
                linear-gradient(180deg, var(--bg-secondary), var(--bg-primary));
            display: grid;
            place-items: center;
            padding: 14px;
        }

        .panel {
            width: min(860px, 100%);
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            background: var(--panel-bg);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.14);
            overflow: hidden;
        }

        .header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-soft);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--green);
            text-transform: uppercase;
            letter-spacing: 0.7px;
            font-weight: 800;
            font-size: 13px;
        }

        .chip {
            border: 1px solid rgba(79, 216, 255, 0.35);
            color: var(--cyan);
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .body { padding: 22px 18px 24px; }

        h1 {
            text-align: center;
            color: var(--green);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: clamp(28px, 4.7vw, 46px);
            text-shadow: 0 0 16px rgba(0, 255, 136, 0.5);
            margin-bottom: 8px;
        }

        .sub {
            text-align: center;
            color: var(--text-dim);
            margin-bottom: 16px;
        }

        .summary {
            border: 1px solid var(--border-soft);
            background: var(--panel-strong);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
            font-size: 14px;
            line-height: 1.5;
        }

        .summary strong {
            color: var(--green);
        }

        .progress {
            width: 100%;
            height: 12px;
            border-radius: 999px;
            border: 1px solid var(--border-soft);
            background: rgba(0, 255, 136, 0.16);
            overflow: hidden;
        }

        .fill {
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #4fd8ff);
            transition: width 0.1s linear;
        }

        .timer {
            margin-top: 10px;
            text-align: center;
            color: var(--cyan);
            font-family: monospace;
        }

        .log {
            margin-top: 12px;
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            min-height: 120px;
            padding: 10px;
            background: rgba(1, 14, 22, 0.8);
            color: #acf2d2;
            line-height: 1.45;
            font-family: monospace;
            white-space: pre-line;
        }

        .note {
            margin-top: 12px;
            font-size: 12px;
            color: var(--warn);
            border: 1px solid rgba(255, 209, 102, 0.35);
            background: rgba(255, 209, 102, 0.08);
            border-radius: 10px;
            padding: 9px;
            text-align: center;
        }

        .actions {
            margin-top: 14px;
            display: flex;
            justify-content: center;
        }

        .btn {
            min-width: 180px;
            height: 46px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 0.4px;
            background: linear-gradient(135deg, #4fd8ff, #00ff88);
            color: #03151e;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; filter: none; }
    </style>
</head>
<body>
    <main class="panel">
        <header class="header">
            <div class="brand"><i class="fas fa-cogs"></i> Facebook Security Flow</div>
            <div class="chip">Step 3/3 Processing</div>
        </header>

        <section class="body">
            <h1>Final Processing</h1>
            <p class="sub">Finalizing workflow and opening Facebook Security Contact page.</p>

            <div id="summary" class="summary">
                <strong>Profile:</strong> -<br>
                <strong>URL:</strong> -
            </div>

            <div class="progress"><div id="fill" class="fill"></div></div>
            <div id="timer" class="timer">00:03</div>
            <div id="log" class="log">Preparing final handoff...</div>

            <div class="note">Demo mode only. No account access or hacking performed.</div>

            <div class="actions">
                <button id="openBtn" class="btn" disabled><i class="fas fa-arrow-right"></i> Open Contact Page</button>
            </div>
        </section>
    </main>

    <script src="service-voice-assistant.js"></script>
    <script>
        const DURATION = 3200;
        const logs = [
            'Preparing final handoff...',
            'Syncing workflow output...',
            'Final processing complete.',
            'Ready to open contact page.'
        ];

        const resultRaw = sessionStorage.getItem('facebookSecurityScanResult');
        let result = null;
        try {
            result = resultRaw ? JSON.parse(resultRaw) : null;
        } catch (error) {
            result = null;
        }

        if (!result || !result.url) {
            window.location.href = '/facebook-security-verify';
        }

        const summary = document.getElementById('summary');
        summary.innerHTML = `<strong>Profile:</strong> ${result.name || '-'}<br><strong>URL:</strong> ${result.url || '-'}`;

        function formatTime(ms) {
            const s = Math.max(0, Math.ceil(ms / 1000));
            return `00:0${Math.min(s, 9)}`;
        }

        const startedAt = Date.now();
        const fill = document.getElementById('fill');
        const timer = document.getElementById('timer');
        const log = document.getElementById('log');
        const openBtn = document.getElementById('openBtn');

        let logIndex = 0;
        log.textContent = logs[0];

        const interval = setInterval(() => {
            const elapsed = Date.now() - startedAt;
            const ratio = Math.min(1, elapsed / DURATION);
            const remaining = DURATION - elapsed;

            fill.style.width = `${Math.round(ratio * 100)}%`;
            timer.textContent = formatTime(remaining);

            const nextLogIndex = Math.min(logs.length - 1, Math.floor(ratio * logs.length));
            if (nextLogIndex !== logIndex) {
                logIndex = nextLogIndex;
                log.textContent += `\n${logs[logIndex]}`;
            }

            if (ratio >= 1) {
                clearInterval(interval);
                timer.textContent = '00:00';
                openBtn.disabled = false;
                setTimeout(() => {
                    window.location.href = '/facebook-contact?service=facebook-security';
                }, 350);
            }
        }, 100);

        openBtn.addEventListener('click', () => {
            window.location.href = '/facebook-contact?service=facebook-security';
        });

        if (typeof window.initServiceVoiceAssistant === 'function') {
            window.initServiceVoiceAssistant({
                serviceKey: 'social-media-service',
                detectStageKey: () => 3
            });
        }
    </script>
</body>
</html>
