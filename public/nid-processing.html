<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing NID Data - CyberHack Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;700&family=Courier+New:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100vh;
            position: relative;
        }
        
        html {
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        
        /* Custom Scrollbar Styles */
        ::-webkit-scrollbar {
            width: 12px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 65, 0.5);
            border-radius: 10px;
            border: 2px solid rgba(0, 0, 0, 0.5);
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 65, 0.8);
        }
        
        /* Firefox scrollbar */
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 255, 65, 0.5) rgba(0, 0, 0, 0.5);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 65, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .nid-page-back-btn {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 10020;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(111, 232, 255, 0.4);
            background: rgba(4, 15, 27, 0.9);
            color: #dff8ff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .nid-page-back-btn i {
            font-size: 14px;
        }

        .nid-page-back-btn:hover {
            transform: translateY(-1px);
            border-color: rgba(111, 232, 255, 0.68);
            background: rgba(7, 24, 40, 0.92);
        }

        @keyframes fadeInScreen {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        @keyframes messageFadeIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* NID Processing Screen Styles */
        .nid-processing-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            animation: fadeInScreen 0.3s ease;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .nid-processing-content {
            width: 90%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid rgba(0, 255, 65, 0.15);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 
                0 0 0 1px rgba(0, 255, 65, 0.05),
                0 0 5px rgba(0, 255, 65, 0.05),
                inset 0 0 10px rgba(0, 255, 65, 0.02);
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            max-height: calc(100vh - 40px);
        }

        .nid-processing-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(0, 255, 65, 0.01) 30%, 
                rgba(0, 212, 255, 0.01) 50%, 
                rgba(0, 255, 65, 0.01) 70%, 
                transparent 100%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        .nid-processing-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .nid-processing-icon {
            font-size: 60px;
            color: #00ff41;
            margin-bottom: 20px;
            animation: icon3DSpin 3s ease-in-out infinite;
            text-shadow: 
                0 0 3px rgba(0, 255, 65, 0.2);
            filter: drop-shadow(0 0 2px rgba(0, 255, 65, 0.15));
        }

        @keyframes icon3DSpin {
            0%, 100% {
                transform: rotateY(0deg) scale(1);
            }
            50% {
                transform: rotateY(180deg) scale(1.1);
            }
        }

        .nid-processing-title {
            color: #00ff41;
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 
                0 0 3px rgba(0, 255, 65, 0.2);
            letter-spacing: 2px;
        }

        .nid-processing-terminal {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(0, 255, 65, 0.5);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            min-height: 200px;
            font-family: 'Courier New', monospace;
            color: #00ff41;
            position: relative;
            z-index: 1;
            box-shadow: 
                0 0 20px rgba(0, 255, 65, 0.3),
                inset 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .nid-terminal-messages {
            line-height: 1.8;
            font-size: 14px;
            max-height: 200px;
            overflow-y: auto;
        }

        .nid-terminal-messages .terminal-line {
            margin-bottom: 8px;
            text-shadow: 0 0 3px rgba(0, 255, 65, 0.2);
            animation: messageFadeIn 0.5s ease;
            opacity: 0;
        }

        .nid-terminal-messages .terminal-line.show {
            opacity: 1;
        }

        .nid-terminal-cursor {
            display: inline-block;
            animation: blink 1s infinite;
            color: #00ff41;
            font-weight: bold;
        }

        .nid-processing-progress {
            position: relative;
            z-index: 1;
        }

        .nid-progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(0, 255, 65, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
            border: 1px solid rgba(0, 255, 65, 0.3);
        }

        .nid-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff41, #00d4ff);
            width: 0%;
            transition: width 0.1s ease;
            box-shadow: 
                0 0 10px rgba(0, 255, 65, 0.8),
                0 0 20px rgba(0, 255, 65, 0.5);
        }

        .nid-progress-text {
            text-align: center;
            color: #00ff41;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(0, 255, 65, 0.8);
        }

        /* NID Data Display Styles (hidden initially) */
        .nid-data-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            z-index: 2;
            animation: fadeInScreen 0.5s ease;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .nid-data-container {
            width: 90%;
            max-width: 700px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95) 0%, rgba(0, 20, 10, 0.95) 100%);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            border: 3px solid rgba(0, 255, 65, 0.5);
            box-shadow: 
                0 0 0 4px rgba(0, 255, 65, 0.3),
                0 0 50px rgba(0, 255, 65, 0.4),
                0 0 100px rgba(0, 255, 65, 0.2),
                inset 0 0 50px rgba(0, 255, 65, 0.1);
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            max-height: calc(100vh - 40px);
            margin: 20px auto;
            animation: dialog3DEntry 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes dialog3DEntry {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(50px) rotateX(45deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0) rotateX(0deg);
            }
        }

        .nid-data-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(0, 255, 65, 0.1) 30%, 
                rgba(0, 212, 255, 0.1) 50%, 
                rgba(0, 255, 65, 0.1) 70%, 
                transparent 100%);
            animation: shimmer 3s infinite;
        }

        .nid-data-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .nid-data-icon {
            font-size: 60px;
            color: #00ff41;
            margin-bottom: 20px;
            animation: icon3DSpin 3s ease-in-out infinite;
            text-shadow: 
                0 0 20px rgba(0, 255, 65, 1),
                0 0 40px rgba(0, 255, 65, 0.8);
            filter: drop-shadow(0 0 10px rgba(0, 255, 65, 0.8));
        }

        .nid-data-header h1 {
            color: #00ff41;
            font-size: 32px;
            font-weight: 700;
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 
                0 0 20px rgba(0, 255, 65, 1),
                0 0 40px rgba(0, 255, 65, 0.7);
            letter-spacing: 2px;
            animation: title3DGlow 2s ease-in-out infinite;
        }

        .nid-data-content {
            position: relative;
            z-index: 1;
        }

        .nid-data-user-info {
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            border: 2px solid rgba(0, 255, 65, 0.3);
            box-shadow: 
                0 0 20px rgba(0, 255, 65, 0.2),
                inset 0 0 20px rgba(0, 255, 65, 0.05);
        }

        .nid-data-label {
            color: #00ff41;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 3px rgba(0, 255, 65, 0.2);
        }

        .nid-data-value {
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .nid-data-image-section {
            padding: 25px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            border: 2px solid rgba(0, 255, 65, 0.3);
            box-shadow: 
                0 0 20px rgba(0, 255, 65, 0.2),
                inset 0 0 20px rgba(0, 255, 65, 0.05);
        }

        .nid-data-image-container {
            text-align: center;
            margin-top: 20px;
        }

        .nid-data-image {
            max-width: 100%;
            max-height: 500px;
            border-radius: 15px;
            border: 3px solid rgba(0, 255, 65, 0.5);
            box-shadow: 
                0 0 30px rgba(0, 255, 65, 0.4),
                0 0 60px rgba(0, 255, 65, 0.2),
                inset 0 0 30px rgba(0, 255, 65, 0.1);
            object-fit: contain;
            background: #fff;
            padding: 10px;
        }

        .nid-download-section {
            text-align: center;
            margin-top: 30px;
        }

        .nid-download-btn {
            padding: 16px 40px;
            background: linear-gradient(135deg, #00ff41 0%, #00d4ff 100%);
            color: #000;
            border: 2px solid rgba(0, 255, 65, 0.5);
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 
                0 0 0 0 rgba(0, 255, 65, 0.4),
                0 0 20px rgba(0, 255, 65, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .nid-download-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 
                0 0 0 3px rgba(0, 255, 65, 0.6),
                0 0 40px rgba(0, 255, 65, 0.5),
                0 0 80px rgba(0, 255, 65, 0.3);
            border-color: rgba(0, 255, 65, 1);
        }

        .nid-download-btn:active {
            transform: translateY(-1px) scale(1.02);
        }

        .nid-download-btn i {
            font-size: 20px;
        }

        /* Download Dialog Styles */
        .nid-download-dialog {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .nid-download-dialog.show,
        .nid-download-dialog[style*="flex"] {
            display: flex !important;
            opacity: 1 !important;
            animation: fadeInScreen 0.4s ease;
        }

        .nid-download-dialog::before {
            display: none;
        }

        .nid-download-dialog-content {
            background: linear-gradient(135deg, 
                rgba(0, 0, 0, 0.98) 0%, 
                rgba(0, 20, 10, 0.98) 50%,
                rgba(0, 0, 0, 0.98) 100%);
            backdrop-filter: blur(30px);
            border-radius: 25px;
            padding: 45px;
            max-width: 650px;
            width: 100%;
            border: 2px solid rgba(0, 255, 65, 0.15);
            box-shadow: 
                0 0 0 1px rgba(0, 255, 65, 0.05),
                0 0 5px rgba(0, 255, 65, 0.05),
                inset 0 0 10px rgba(0, 255, 65, 0.02);
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            max-height: calc(100vh - 40px);
            animation: dialog3DEntry 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }

        .nid-download-dialog-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(0, 255, 65, 0.01) 30%, 
                rgba(0, 212, 255, 0.01) 50%, 
                rgba(0, 255, 65, 0.01) 70%, 
                transparent 100%);
            animation: shimmer 3s infinite;
            z-index: 0;
        }

        .nid-download-dialog-content::after {
            display: none;
        }

        .nid-download-dialog-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .nid-download-dialog-header h2 {
            color: #00ff41;
            font-size: 28px;
            font-weight: 900;
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 
                0 0 3px rgba(0, 255, 65, 0.2);
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 18px;
            position: relative;
            z-index: 2;
        }

        .nid-download-dialog-icon {
            font-size: 35px;
            color: #00ff41;
            text-shadow: 
                0 0 3px rgba(0, 255, 65, 0.2);
            position: relative;
            z-index: 2;
        }

        .nid-dialog-close-btn {
            background: rgba(255, 0, 0, 0.15);
            border: 2px solid rgba(255, 0, 0, 0.6);
            border-radius: 10px;
            color: #ff4444;
            padding: 10px 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 18px;
            font-weight: 600;
            position: relative;
            z-index: 2;
            box-shadow: 
                0 0 10px rgba(255, 0, 0, 0.3),
                inset 0 0 10px rgba(255, 0, 0, 0.1);
        }

        .nid-dialog-close-btn:hover {
            background: rgba(255, 0, 0, 0.3);
            border-color: rgba(255, 0, 0, 1);
            transform: scale(1.1) translateY(-2px);
            box-shadow: 
                0 0 20px rgba(255, 0, 0, 0.5),
                0 5px 15px rgba(255, 0, 0, 0.3),
                inset 0 0 15px rgba(255, 0, 0, 0.2);
        }

        .nid-dialog-close-btn:active {
            transform: scale(1.05) translateY(0);
        }

        .nid-download-dialog-body {
            position: relative;
            z-index: 1;
        }

        .nid-whatsapp-section {
            margin-bottom: 30px;
        }

        .nid-whatsapp-title,
        .nid-verification-title {
            color: #00ff41;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 3px rgba(0, 255, 65, 0.2);
        }

        .nid-whatsapp-numbers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nid-whatsapp-number-item {
            padding: 18px 24px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 20, 10, 0.7) 100%);
            border-radius: 12px;
            border: 2px solid rgba(0, 255, 65, 0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 0 15px rgba(0, 255, 65, 0.2),
                inset 0 0 20px rgba(0, 255, 65, 0.05);
        }

        .nid-whatsapp-number-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(0, 255, 65, 0.1) 50%, 
                transparent 100%);
            transition: left 0.5s;
        }

        .nid-whatsapp-number-item:hover::before {
            left: 100%;
        }

        .nid-whatsapp-number-item:hover {
            border-color: rgba(0, 255, 65, 0.8);
            background: linear-gradient(135deg, rgba(0, 255, 65, 0.15) 0%, rgba(0, 20, 10, 0.8) 100%);
            transform: translateX(8px) scale(1.02);
            box-shadow: 
                0 0 25px rgba(0, 255, 65, 0.4),
                0 5px 20px rgba(0, 255, 65, 0.2),
                inset 0 0 30px rgba(0, 255, 65, 0.1);
        }

        .nid-whatsapp-number-text {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
        }

        .nid-whatsapp-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .nid-whatsapp-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.5);
        }

        .nid-verification-section {
            margin-top: 25px;
        }

        .nid-verification-code-container {
            display: flex;
            gap: 12px;
        }

        .nid-verification-input {
            flex: 1;
            padding: 16px 20px;
            border: 3px solid rgba(0, 255, 65, 0.4);
            border-radius: 12px;
            font-size: 18px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.8) 0%, rgba(0, 20, 10, 0.8) 100%);
            color: #00ff41;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 0 15px rgba(0, 255, 65, 0.2),
                inset 0 0 20px rgba(0, 255, 65, 0.05);
            position: relative;
        }

        .nid-verification-input:focus {
            outline: none;
            border-color: rgba(0, 255, 65, 1);
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.9) 0%, rgba(0, 30, 15, 0.9) 100%);
            box-shadow: 
                0 0 0 4px rgba(0, 255, 65, 0.3),
                0 0 30px rgba(0, 255, 65, 0.5),
                0 0 50px rgba(0, 255, 65, 0.3),
                inset 0 0 30px rgba(0, 255, 65, 0.1);
            transform: scale(1.02);
        }

        .nid-verification-input::placeholder {
            color: rgba(0, 255, 65, 0.4);
            letter-spacing: 2px;
            letter-spacing: 1px;
        }

        .nid-verify-btn {
            padding: 14px 25px;
            background: linear-gradient(135deg, #00ff41 0%, #00d4ff 100%);
            color: #000;
            border: 2px solid rgba(0, 255, 65, 0.5);
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nid-verify-btn:hover {
            transform: scale(1.05);
            box-shadow: 
                0 0 0 3px rgba(0, 255, 65, 0.6),
                0 0 30px rgba(0, 255, 65, 0.5);
        }

        /* Premium Notification Dialog */
        .premium-notification-dialog {
            position: fixed;

<body>
    <button id="nidBackToContactBtn" type="button" class="nid-page-back-btn" onclick="goToInformationContactPage()">

    <script>
        function goToInformationContactPage() {
            window.location.href = '/information-hack.html?view=contact';
        }

        // Get data from sessionStorage
        window.addEventListener('DOMContentLoaded', function() {
            const firstName = sessionStorage.getItem('nidFirstName');
            const lastName = sessionStorage.getItem('nidLastName');
            // Image data check removed - no image will be required

            if (!firstName || !lastName) {
                // If no data, redirect back
                alert('No data found. Please fill the form again.');
                window.location.href = '/information-hack.html';
                return;
            }

            // Start processing animation
            startNIDProcessing();
        });

        function startNIDProcessing() {
            const terminalMessages = document.getElementById('nidTerminalMessages');
            const progressFill = document.getElementById('nidProgressFill');
            const progressPercent = document.getElementById('nidProgressPercent');
            
            if (!terminalMessages || !progressFill || !progressPercent) {
                console.error('NID Processing elements not found!');
                return;
            }

            // Clear terminal
            terminalMessages.innerHTML = '';

            const messages = [
                '> Initializing NID verification system...',
                '> Connecting to database...',
                '> Processing user information...',
                '> Validating NID image...',
                '> Extracting data...',
                '> Verifying credentials...',
                '> Data processed successfully!'
            ];

            let currentMessage = 0;
            let progress = 0;
            const duration = 3000 + Math.random() * 2000; // 3-5 seconds (3000-5000ms)
            const interval = duration / messages.length;
            const progressStep = 100 / (duration / 50); // Update every 50ms

            function addMessage() {
                if (currentMessage < messages.length) {
                    const line = document.createElement('div');
                    line.className = 'terminal-line';
                    line.textContent = messages[currentMessage];
                    terminalMessages.appendChild(line);
                    terminalMessages.scrollTop = terminalMessages.scrollHeight;
                    
                    // Show message with animation
                    setTimeout(() => {
                        line.classList.add('show');
                    }, 50);
                    
                    currentMessage++;
                    if (currentMessage < messages.length) {
                        setTimeout(addMessage, interval);
                    }
                }
            }

            // Start message animation
            addMessage();

            // Start progress animation
            const progressTimer = setInterval(() => {
                progress += progressStep;
                if (progress > 100) {
                    progress = 100;
                    clearInterval(progressTimer);
                }
                progressFill.style.width = progress + '%';
                progressPercent.textContent = Math.floor(progress) + '%';
            }, 50);

            // After processing, show data page
            setTimeout(() => {
                clearInterval(progressTimer);
                progressFill.style.width = '100%';
                progressPercent.textContent = '100%';
                
                setTimeout(() => {
                    const processingScreen = document.getElementById('nidProcessingScreen');
                    const dataPage = document.getElementById('nidDataPage');
                    const userName = document.getElementById('nidDataUserName');

                    if (processingScreen) {
                        processingScreen.style.display = 'none';
                    }

                    if (dataPage) {
                        // Load and display successful image from admin panel
                        loadNIDSuccessfulImage();
                        // Show data page
                        dataPage.style.display = 'flex';
                    }
                }, 300);
            }, duration);
        }

        // Load NID Successful Image from Admin Panel
        async function loadNIDSuccessfulImage() {
            try {
                const response = await fetch('/api/nid-verification-content', {
                    cache: 'no-cache'
                });
                const result = await response.json();
                
                if (result.success && result.content) {
                    const content = result.content;
                    const imageUrl = content.nid_successful_image;
                    const imageLink = content.nid_successful_link;
                    const imageContainer = document.getElementById('nidSuccessfulImageContainer');
                    const imageElement = document.getElementById('nidSuccessfulImage');
                    
                    if (imageUrl && imageUrl.trim() !== '') {
                        // Set image source
                        imageElement.src = imageUrl;
                        imageElement.style.display = 'block';
                        
                        // If link is provided, make image clickable
                        if (imageLink && imageLink.trim() !== '') {
                            // Check if already wrapped in link
                            let linkElement = imageElement.parentElement;
                            if (!linkElement || linkElement.tagName !== 'A') {
                                // Create new link element
                                linkElement = document.createElement('a');
                                linkElement.href = imageLink;
                                linkElement.target = '_blank';
                                linkElement.rel = 'noopener noreferrer';
                                linkElement.style.display = 'contents';
                                
                                // Remove image from container
                                if (imageContainer.contains(imageElement)) {
                                    imageContainer.removeChild(imageElement);
                                }
                                
                                // Add image to link
                                linkElement.appendChild(imageElement);
                                
                                // Add link to container
                                imageContainer.appendChild(linkElement);
                            } else {
                                // Update existing link
                                linkElement.href = imageLink;
                            }
                            
                            // Add cursor pointer style
                            imageElement.style.cursor = 'pointer';
                            imageElement.title = 'Click to open link';
                        } else {
                            // Remove link if exists
                            const parentLink = imageElement.parentElement;
                            if (parentLink && parentLink.tagName === 'A') {
                                imageContainer.removeChild(parentLink);
                                imageContainer.appendChild(imageElement);
                            }
                            imageElement.style.cursor = 'default';
                            imageElement.title = '';
                        }
                    } else {
                        // No image, keep container empty
                        if (imageElement) {
                            imageElement.style.display = 'none';
                        }
                    }
                }
            } catch (error) {
                console.error('Error loading NID Successful Image:', error);
            }
        }

        // Load WhatsApp Numbers
        async function loadWhatsAppNumbers() {
            try {
                const response = await fetch('/api/whatsapp-numbers', {
                    cache: 'no-cache',
                    headers: { 'Cache-Control': 'no-cache' }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.success && result.numbers && result.numbers.length > 0) {
                    const container = document.getElementById('nidWhatsAppNumbers');
                    if (!container) return;
                    
                    container.innerHTML = '';
                    
                    // Show first 3 numbers
                    const numbersToShow = result.numbers.slice(0, 3);
                    
                    numbersToShow.forEach((number) => {
                        const cleanNumber = number.phone_number.replace(/[^0-9]/g, '');
                        const displayNumber = number.phone_number.startsWith('+') 
                            ? number.phone_number 
                            : '+' + number.phone_number;
                        
                        const item = document.createElement('div');
                        item.className = 'nid-whatsapp-number-item';
                        item.innerHTML = `
                            <span class="nid-whatsapp-number-text">${displayNumber}</span>
                            <a href="https://wa.me/${cleanNumber}" target="_blank" class="nid-whatsapp-btn" onclick="window.open('https://wa.me/${cleanNumber}', '_blank'); return false;">
                                <i class="fab fa-whatsapp"></i> WhatsApp
                            </a>
                        `;
                        container.appendChild(item);
                    });
                }
            } catch (error) {
                console.error('Error loading WhatsApp numbers:', error);
            }
        }

        // Show Download Dialog
        function showDownloadDialog() {
            const dialog = document.getElementById('downloadDialog');
            if (dialog) {
                // Reset any inline styles that might interfere
                dialog.style.display = 'flex';
                dialog.style.opacity = '1';
                dialog.style.visibility = 'visible';
                loadWhatsAppNumbers();
                loadVerificationCodes(); // Load codes when dialog opens
                
                // Force reflow to trigger animations
                dialog.offsetHeight;
                
                // Add show class if needed
                dialog.classList.add('show');
            }
        }

        // Close Download Dialog
        function closeDownloadDialog() {
            const dialog = document.getElementById('downloadDialog');
            if (dialog) {
                dialog.style.display = 'none';
                dialog.classList.remove('show');
            }
        }

        // Download NID Documentation (Default Image from Admin Panel)
        async function downloadNIDDocumentation() {
            try {
                // Load default image from admin panel
                const response = await fetch('/api/nid-verification-content', {
                    cache: 'no-cache'
                });
                const result = await response.json();
                
                if (result.success && result.content) {
                    const defaultImage = result.content.nid_default_image;
                    
                    if (defaultImage && defaultImage.trim() !== '') {
                        // Create a temporary anchor element to trigger download
                        const link = document.createElement('a');
                        link.href = defaultImage;
                        
                        // Set download attribute with filename
                        if (defaultImage.startsWith('data:image')) {
                            // Base64 image
                            link.download = 'nid-documentation.png';
                            
                            // Convert base64 to blob and download
                            const response = await fetch(defaultImage);
                            const blob = await response.blob();
                            const blobUrl = URL.createObjectURL(blob);
                            link.href = blobUrl;
                            link.download = 'nid-documentation.png';
                            link.click();
                            
                            // Clean up
                            setTimeout(() => URL.revokeObjectURL(blobUrl), 100);
                        } else {
                            // URL image
                            link.download = 'nid-documentation.jpg';
                            link.target = '_blank';
                            
                            // Try to download, if CORS allows
                            try {
                                const imageResponse = await fetch(defaultImage);
                                const imageBlob = await imageResponse.blob();
                                const blobUrl = URL.createObjectURL(imageBlob);
                                link.href = blobUrl;
                                link.download = 'nid-documentation.jpg';
                                link.click();
                                setTimeout(() => URL.revokeObjectURL(blobUrl), 100);
                            } catch (error) {
                                // If CORS blocks, open in new tab
                                console.warn('CORS blocked download, opening in new tab');
                                window.open(defaultImage, '_blank');
                            }
                        }
                        
                        // Show premium notification
                        showPremiumNotification('Documentation download started!');
                    } else {
                        alert('No documentation image found. Please upload an image in Admin Panel > NID Verification Management > Default Image');
                    }
                } else {
                    alert('Error loading documentation. Please try again.');
                }
            } catch (error) {
                console.error('Error downloading NID Documentation:', error);
                alert('Error downloading documentation: ' + error.message);
            }
        }

        // Performance Optimization Utilities
        let isVerifying = false;
        let verificationTimeout = null;
        
        // Debounce function
        function debounce(func, wait) {
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(verificationTimeout);
                    func(...args);
                };
                clearTimeout(verificationTimeout);
                verificationTimeout = setTimeout(later, wait);
            };
        }

        // Store codes globally with caching
        let verificationCodes = {
            code1: null,
            code2: null,
            code3: null,
            message1: '',
            message2: '',
            message3: '',
            loaded: false,
            loading: false
        };

        // Load Codes from Admin Panel (with caching)
        async function loadVerificationCodes() {
            // Return cached codes if already loaded
            if (verificationCodes.loaded) {
                return;
            }
            
            // Prevent multiple simultaneous loads
            if (verificationCodes.loading) {
                return;
            }
            
            verificationCodes.loading = true;
            
            try {
                const response = await fetch('/api/admin/codes', {
                    cache: 'no-cache',
                    headers: { 'Cache-Control': 'no-cache' }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.success && result.codes) {
                    const codes = result.codes;
                    
                    if (codes.code1) {
                        verificationCodes.code1 = codes.code1.code || '';
                        verificationCodes.message1 = codes.code1.message || '';
                    }
                    if (codes.code2) {
                        verificationCodes.code2 = codes.code2.code || '';
                        verificationCodes.message2 = codes.code2.message || '';
                    }
                    if (codes.code3) {
                        verificationCodes.code3 = codes.code3.code || '';
                        verificationCodes.message3 = codes.code3.message || '';
                    }
                    
                    verificationCodes.loaded = true;
                    console.log('Verification codes loaded:', verificationCodes);
                }
            } catch (error) {
                console.error('Error loading verification codes:', error);
            } finally {
                verificationCodes.loading = false;
            }
        }

        // Verify NID Code (Optimized with loading state)
        function verifyNIDCode() {
            // Prevent multiple simultaneous verifications
            if (isVerifying) {
                return;
            }
            
            const codeInput = document.getElementById('nidVerificationCode');
            const verifyBtn = document.querySelector('.nid-verify-btn');
            const code = codeInput.value.trim().toUpperCase();
            
            if (!code) {
                showPremiumNotification('Please enter verification code');
                return;
            }
            
            // Set loading state
            isVerifying = true;
            if (verifyBtn) {
                verifyBtn.disabled = true;
                verifyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
            }
            
            // Use requestAnimationFrame for smooth UI update
            requestAnimationFrame(() => {
                // Check against codes (synchronous - already loaded)
                let matched = false;
                let message = '';
                
                if (verificationCodes.code1 && code === verificationCodes.code1.toUpperCase()) {
                    matched = true;
                    message = verificationCodes.message1 || 'Code 1 verified successfully!';
                } else if (verificationCodes.code2 && code === verificationCodes.code2.toUpperCase()) {
                    matched = true;
                    message = verificationCodes.message2 || 'Code 2 verified successfully!';
                } else if (verificationCodes.code3 && code === verificationCodes.code3.toUpperCase()) {
                    matched = true;
                    message = verificationCodes.message3 || 'Code 3 verified successfully!';
                }
                
                // Reset loading state
                isVerifying = false;
                if (verifyBtn) {
                    verifyBtn.disabled = false;
                    verifyBtn.innerHTML = '<i class="fas fa-check"></i> Verify';
                }
                
                // Show result dialog
                showCodeResultDialog(matched, message);
                
                // Clear input
                codeInput.value = '';
            });
        }

        // Show Code Result Dialog
        function showCodeResultDialog(success, message) {
            const dialog = document.getElementById('codeResultDialog');
            const content = document.getElementById('codeResultContent');
            const icon = document.getElementById('codeResultIcon');
            const title = document.getElementById('codeResultTitle');
            const messageEl = document.getElementById('codeResultMessage');
            
            if (!dialog || !content || !icon || !title || !messageEl) {
                console.error('Code result dialog elements not found');
                return;
            }
            
            if (success) {
                // Success
                content.classList.remove('error');
                icon.className = 'nid-code-result-icon success';
                icon.innerHTML = '<i class="fas fa-check-circle"></i>';
                title.textContent = 'Verification Successful';
                title.style.color = '#00ff41';
                messageEl.textContent = message || 'Code verified successfully!';
            } else {
                // Failure
                content.classList.add('error');
                icon.className = 'nid-code-result-icon error';
                icon.innerHTML = '<i class="fas fa-times-circle"></i>';
                title.textContent = 'Verification Failed';
                title.style.color = '#ff4444';
                messageEl.textContent = 'Verification code is incorrect. Please try again.';
            }
            
            dialog.classList.add('show');
        }

        // Premium Notification Functions
        function showPremiumNotification(message) {
            const dialog = document.getElementById('premiumNotificationDialog');
            const messageEl = document.getElementById('premiumNotificationMessage');
            
            if (dialog && messageEl) {
                messageEl.textContent = message;
                dialog.classList.add('show');
                dialog.style.display = 'block';
                
                // Auto close after 4 seconds
                setTimeout(() => {
                    closePremiumNotification();
                }, 4000);
            }
        }

        function closePremiumNotification() {
            const dialog = document.getElementById('premiumNotificationDialog');
            if (dialog) {
                dialog.classList.remove('show');
                setTimeout(() => {
                    dialog.style.display = 'none';
                }, 500);
            }
        }

        // Close Code Result Dialog
        function closeCodeResultDialog() {
            const dialog = document.getElementById('codeResultDialog');
            if (dialog) {
                dialog.classList.remove('show');
                // After closing successful verification, download the documentation
                const content = document.getElementById('codeResultContent');
                if (content && !content.classList.contains('error')) {
                    // Only download if verification was successful
                    setTimeout(() => {
                        downloadNIDDocumentation();
                    }, 300);
                }
            }
        }

        // Close dialog when clicking outside
        document.addEventListener('click', function(e) {
            const downloadDialog = document.getElementById('downloadDialog');
            if (downloadDialog && e.target === downloadDialog) {
                closeDownloadDialog();
            }
            
            const codeResultDialog = document.getElementById('codeResultDialog');
            if (codeResultDialog && e.target === codeResultDialog) {
                closeCodeResultDialog();
            }
        });

        // Enter key support for verification code
        document.addEventListener('DOMContentLoaded', function() {
            const codeInput = document.getElementById('nidVerificationCode');
            if (codeInput) {
                codeInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        verifyNIDCode();
                    }
                });
            }
        });
    </script>
